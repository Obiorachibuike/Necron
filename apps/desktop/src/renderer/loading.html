<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening your workspace · CareerPilot Desktop</title>
    <link rel="stylesheet" href="./ui.css" />
  </head>
  <body>
    <div class="loader-wrap">
      <div class="loader-card">
        <span class="loader-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 18 12 4l8 14-8-4-8 4Z" fill="currentColor" />
            <path d="M12 10v8" stroke="var(--bg)" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </span>
        <div>
          <p class="loader-title">Opening your workspace</p>
          <p class="loader-sub" id="loading-target">Contacting the server you connected…</p>
        </div>
        <div class="bar" role="progressbar" aria-label="Loading workspace"></div>
        <p class="loader-sub" id="loading-note">
          This takes a moment on a cold server. Work already saved is not affected.
        </p>
      </div>
    </div>
    <script type="module" src="./loading.js"></script>
  </body>
</html>
